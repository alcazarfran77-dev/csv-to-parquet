name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Node.js lets the tests compare the desktop engine with the browser engine
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # the annotate plugin shows each failing test on the run's summary page
      - run: python -m pip install -r requirements-dev.txt pytest-github-actions-annotate-failures
      - run: python -m py_compile desktop/csv_to_parquet.py desktop/engine.py desktop/i18n.py
      - run: python -m pytest -v

  web:
    name: Browser version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check that web/dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::web/dist/csv-to-parquet.html is out of date. Run 'npm run build' in web/ and commit it."
            exit 1
          fi
