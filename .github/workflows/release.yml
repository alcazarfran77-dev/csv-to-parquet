name: Release

# Publishing a GitHub release (for example v1.0.0, created on the Releases page)
# builds the Windows executable and attaches it, with the browser version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild the files for, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the Windows executable
        working-directory: desktop
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --windowed --name "CSV to Parquet" --icon icon.ico `
            --add-data "..\locales;locales" --collect-all tkinterdnd2 --collect-data tzdata `
            --exclude-module pyarrow.tests --exclude-module pandas --exclude-module numpy.tests `
            csv_to_parquet.py
          Compress-Archive -Path "dist\CSV to Parquet" -DestinationPath "..\CSV-to-Parquet-windows.zip"
      - name: Publish the release
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title "CSV to Parquet $env:TAG" --generate-notes }
          gh release upload $env:TAG CSV-to-Parquet-windows.zip web/dist/csv-to-parquet.html --clobber
